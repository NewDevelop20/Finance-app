name: FinanceTracker
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # No usamos aún un equipo de Apple Developer real: esto permite que el build de
  # validación (sin firma) funcione en CI sin ningún secreto configurado.
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Cámbialo por tu Team ID cuando tengas cuenta de Apple Developer (sección 7 del README).
    DEVELOPMENT_TEAM: ""

targets:
  FinanceTracker:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Intents
      - path: Views
    # Sin entitlements a propósito: la firma gratuita de Apple (Personal Team, la que
    # usan AltStore/SideStore) no admite la capacidad "App Groups". Ver
    # Services/SharedDataStore.swift y el README, sección 7, para el porqué.
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.financetracker.refreshSummary
        CFBundleURLTypes:
          - CFBundleURLName: com.tunombre.financetracker.quickadd
            CFBundleURLSchemes:
              - financetracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunombre.financetracker
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: FinanceTrackerWidgetExtension
        embed: true

  FinanceTrackerWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Models/Enums.swift
      - path: App/AppState.swift
      - path: Intents/QuickAddIntents.swift
      - path: Services/SharedDataStore.swift
    # Mismo motivo que en el target de la app: sin App Groups, para que la firma
    # gratuita funcione. El widget sigue siendo un botón de acceso rápido plenamente
    # funcional; solo pierde el "hoy has gastado X€" en pantalla (ver SharedDataStore).
    info:
      path: WidgetInfo.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunombre.financetracker.widget
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  FinanceTracker:
    build:
      targets:
        FinanceTracker: all
        FinanceTrackerWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
