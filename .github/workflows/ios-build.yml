name: iOS build check

# Compila la app (sin firmar, para simulador) en un Mac que GitHub presta gratis.
# Es la forma de comprobar que el código compila sin tener un Mac propio: cada push
# a cualquier rama, o cada Pull Request, dispara este workflow. Revisa la pestaña
# "Actions" del repo para ver el resultado (✅ o ❌ con el log de errores).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleccionar la versión de Xcode más reciente del runner
        # XcodeGen (Homebrew instala siempre la versión más reciente) puede generar el
        # proyecto en un formato más nuevo del que entiende el Xcode que el runner
        # tiene seleccionado por defecto ("cannot be opened because it is in a future
        # Xcode project file format"). Forzamos la versión de Xcode más nueva instalada
        # en la imagen para evitar ese desajuste.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode desde project.yml
        working-directory: FinanceTrackerApp
        run: xcodegen generate

      - name: Compilar para iOS Simulator (sin firma)
        working-directory: FinanceTrackerApp
        run: |
          xcodebuild build \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
